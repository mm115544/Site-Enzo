<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E5B4"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8962E"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#glow)" stroke="url(#gold)" stroke-width="10" fill="none" stroke-linecap="round">
    <!-- synapse network -->
    <line x1="256" y1="150" x2="150" y2="256"/>
    <line x1="256" y1="150" x2="362" y2="256"/>
    <line x1="150" y1="256" x2="256" y2="362"/>
    <line x1="362" y1="256" x2="256" y2="362"/>
    <line x1="256" y1="150" x2="256" y2="362"/>
    <line x1="150" y1="256" x2="362" y2="256"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="256" cy="150" r="26"/>
    <circle cx="150" cy="256" r="22"/>
    <circle cx="362" cy="256" r="22"/>
    <circle cx="256" cy="362" r="26"/>
    <circle cx="256" cy="256" r="16"/>
  </g>
</svg>
