name: Déployer Synapse sur GitHub Pages

on:
  push:
    branches: ["claude/deepstash-french-guide-mnkv92"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le dossier du site (app uniquement)
        run: |
          mkdir -p _site
          cp index.html content.js sw.js manifest.webmanifest icon.svg _site/

      - name: Configurer Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
