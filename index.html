<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Synapse — Deviens un monstre</title>
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="Un TikTok de l'apprentissage pour reprogrammer ton cerveau : trading, mental, physique, savoir, neuroplasticité.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synapse">
<style>
  :root{
    --bg:#0E0E0E; --bg2:#151515; --card:#1A1A1A; --line:#2A2A2A;
    --gold:#D4AF37; --gold-soft:#B8962E; --gold-pale:#F2E5B4;
    --text:#F4F0E6; --muted:#9A968C; --dim:#6A665E;
    --ok:#4ADE80; --warn:#EF6B6B;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none}
  body{overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  #app{height:100vh;height:100dvh;position:relative;overflow:hidden}

  /* ---------- VIEWS ---------- */
  .view{position:absolute;inset:0;display:none;flex-direction:column}
  .view.active{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---------- FEED (TikTok) ---------- */
  #feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #feed::-webkit-scrollbar{display:none}
  .slide{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
    position:relative;display:flex;flex-direction:column;justify-content:center;
    padding:calc(var(--safe-t) + 74px) 82px calc(var(--safe-b) + 96px) 20px}
  .slide.end{padding-left:24px;padding-right:24px}
  .slide-bg{position:absolute;inset:0;z-index:0}
  .slide-bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,10,10,.10) 0%, rgba(10,10,10,.30) 42%, rgba(10,10,10,.74) 100%)}
  /* fond neuronal animé, derrière tout le fil */
  #fx{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
  #feed{position:relative;z-index:1;background:transparent}
  .slide-inner{position:relative;z-index:1;max-width:560px;margin:0 auto;width:100%}
  .theme-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
    padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(6px);margin-bottom:18px}
  .slide .ill{width:92px;height:92px;margin:0 0 16px;border-radius:22px;
    display:flex;align-items:center;justify-content:center}
  .slide .ill svg{width:58px;height:58px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.45))}
  .rev-card .ill svg{width:56px;height:56px;filter:drop-shadow(0 3px 12px rgba(0,0,0,.45))}
  .hero{width:100%;height:clamp(150px,46vw,210px);border-radius:18px;overflow:hidden;
    margin:0 0 15px;position:relative;border:1px solid rgba(255,255,255,.09)}
  .hero .scene{position:absolute;inset:0;width:100%;height:100%}
  .hero.photo{background-size:cover;background-position:center}
  .hero.photo::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(12,12,12,.10) 0%, rgba(12,12,12,.30) 55%, rgba(12,12,12,.72) 100%)}
  .hero .credit{position:absolute;left:10px;bottom:7px;z-index:2;font-size:9px;
    color:rgba(255,255,255,.7);background:rgba(0,0,0,.28);padding:2px 6px;border-radius:6px;backdrop-filter:blur(3px)}
  .hero .hero-accent{position:absolute;left:0;top:0;height:4px;width:100%;z-index:2}
  .slide h2{font-size:26px;line-height:1.22;margin:0 0 14px;font-weight:800;letter-spacing:-.3px}
  .slide p{font-size:17px;line-height:1.55;margin:0 0 18px;color:#E9E4D7}
  .slide .src{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .slide .src b{color:var(--gold-pale);font-weight:600}

  /* action rail */
  .rail{position:absolute;right:14px;bottom:calc(var(--safe-b) + 108px);z-index:3;
    display:flex;flex-direction:column;gap:20px;align-items:center}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#fff;font-weight:600}
  .rail .ic{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:23px;backdrop-filter:blur(6px);transition:transform .15s}
  .rail button:active .ic{transform:scale(.86)}
  .rail button.on .ic{background:var(--gold);border-color:var(--gold);color:#111}
  .rail button.on-red .ic{background:var(--warn);border-color:var(--warn)}

  .swipe-hint{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 92px);z-index:2;text-align:center;
    font-size:12px;color:rgba(255,255,255,.6);animation:bob 1.8s ease-in-out infinite;pointer-events:none}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:.9}}

  /* ---------- TOP BAR ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;z-index:5;
    padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
  .brand{font-weight:800;font-size:18px;letter-spacing:.5px;color:var(--gold)}
  .brand span{color:#fff}
  .top-stats{margin-left:auto;display:flex;gap:8px}
  .pill{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;
    padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
  .pill.streak{color:#FFB454}.pill.xp{color:var(--gold-pale)}
  .pill.sound{color:#8FE3D0;border-color:rgba(143,227,208,.35)}
  .pill.sound.on{background:#8FE3D0;color:#0c1a17;border-color:#8FE3D0}
  @keyframes spulse{0%,100%{box-shadow:0 0 0 0 rgba(143,227,208,0)}50%{box-shadow:0 0 0 4px rgba(143,227,208,.20)}}
  .pill.sound:not(.on){animation:spulse 2.6s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .pill.sound:not(.on){animation:none} }

  /* ---------- BOTTOM NAV ---------- */
  .nav{position:absolute;bottom:0;left:0;right:0;z-index:6;display:flex;
    padding:8px 6px calc(var(--safe-b) + 8px);background:rgba(10,10,10,.92);
    border-top:1px solid var(--line);backdrop-filter:blur(12px)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;color:var(--dim);padding:4px 0;font-weight:600}
  .nav button .nic{font-size:21px;line-height:1}
  .nav button.active{color:var(--gold)}
  .nav .badge{position:absolute;transform:translate(14px,-6px);min-width:16px;height:16px;padding:0 4px;
    background:var(--warn);color:#fff;border-radius:8px;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center}

  /* ---------- GENERIC PAGE ---------- */
  .page{padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 96px)}
  .page h1{font-size:26px;margin:2px 0 4px;font-weight:800;letter-spacing:-.3px}
  .page .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .sec-title{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold-soft);
    font-weight:700;margin:26px 0 12px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.3}
  .card p{margin:0;font-size:14px;line-height:1.5;color:#DDD8CC}
  .card .meta{margin-top:10px;font-size:12px;color:var(--muted)}
  .card .cardchip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;gap:5px;align-items:center;margin-bottom:10px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .theme-card{border-radius:16px;padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;
    border:1px solid var(--line);position:relative;overflow:hidden}
  .theme-card .te{font-size:26px}
  .theme-card .tn{font-weight:800;font-size:15px;margin-top:6px}
  .theme-card .td{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px;line-height:1.35}

  .stat-row{display:flex;gap:12px;margin-bottom:8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
  .stat .n{font-size:28px;font-weight:800;color:var(--gold)}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

  .identity{background:linear-gradient(135deg,#1d1a12,#241f10);border:1px solid var(--gold-soft);
    border-radius:18px;padding:20px;margin-bottom:8px}
  .identity .lab{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold-soft);font-weight:700}
  .identity .st{font-size:19px;font-weight:700;line-height:1.4;margin-top:8px;color:var(--gold-pale)}
  .identity .who{font-size:13px;color:var(--muted);margin-top:10px}

  .levelbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
  .levelbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold-pale));border-radius:6px;transition:width .4s}

  .btn{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;font-weight:800;font-size:16px}
  .btn-gold{background:var(--gold);color:#141414}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-red{background:transparent;border:1px solid var(--warn);color:var(--warn)}
  .btn + .btn{margin-top:10px}

  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .empty .e{font-size:44px;margin-bottom:12px}

  /* ---------- REVIEW ---------- */
  .rev-wrap{padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 84px);display:flex;flex-direction:column;height:100%}
  .rev-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;
    display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
  .rev-card h2{font-size:23px;line-height:1.28;margin:0 0 4px}
  .rev-answer{margin-top:16px;font-size:16px;line-height:1.55;color:#E4DFD2}
  .rev-actions{display:flex;gap:10px;margin-top:16px}
  .rev-actions button{flex:1;padding:14px 6px;border-radius:13px;font-weight:800;font-size:14px}
  .rev-hard{background:#3a1f1f;color:#ffb4b4;border:1px solid #5c2b2b}
  .rev-mid{background:#332c17;color:#f2d98a;border:1px solid #55491f}
  .rev-easy{background:#1d3320;color:#a7e6b4;border:1px solid #2c5c34}
  .reveal-btn{margin-top:18px}

  /* ---------- MODAL ---------- */
  .modal{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);
    display:none;align-items:flex-end}
  .modal.open{display:flex}
  .sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg2);
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    padding:22px 20px calc(var(--safe-b) + 22px);animation:up .28s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h2{margin:0 0 4px;font-size:22px;font-weight:800}
  .sheet .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  label.fld{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
  input.tf,textarea.tf{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font-size:16px;padding:13px;font-family:inherit}
  textarea.tf{min-height:96px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
  .chips button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:14px;font-weight:600}
  .chips button.sel{background:var(--gold);color:#141414;border-color:var(--gold)}
  .toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%) translateY(20px);
    z-index:30;background:var(--gold);color:#141414;font-weight:800;font-size:14px;padding:12px 20px;border-radius:999px;
    opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- SPLASH ---------- */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 20%, #1a1a1a, #0b0b0b 70%);
    display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-inner{text-align:center;animation:spin-up .8s ease}
  @keyframes spin-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sp-logo{font-size:70px;filter:drop-shadow(0 6px 24px rgba(212,175,55,.45));animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .sp-name{font-size:34px;font-weight:800;letter-spacing:2px;color:var(--gold);margin-top:10px}
  .sp-name span{color:#fff}
  .sp-tag{color:var(--muted);font-size:14px;margin-top:8px}
  .sp-proof{margin-top:26px;color:var(--gold-pale);font-size:13px;font-weight:700}
  .stars{color:var(--gold);letter-spacing:2px}

  /* ---------- COMMENTAIRES ---------- */
  .cmts{max-height:54vh;overflow-y:auto;margin-top:4px}
  .cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#141414;font-size:15px}
  .cbody{flex:1;min-width:0}
  .cn{font-size:12.5px;color:var(--muted);font-weight:700}
  .cn span{color:var(--dim);font-weight:500}
  .ct{font-size:14.5px;line-height:1.4;margin:2px 0 5px}
  .cmeta{font-size:11.5px;color:var(--dim)}
  .cbar{display:flex;gap:8px;margin-top:12px;align-items:center}
  .cbar .tf{flex:1}
  .cpub{background:var(--gold);color:#141414;font-weight:800;border-radius:12px;padding:12px 16px;white-space:nowrap}
  .rail button b{font-size:11.5px;font-weight:800;line-height:1}
  .ob-proof{display:flex;align-items:center;gap:8px;justify-content:center;margin:-6px 0 16px;
    color:var(--gold-pale);font-size:13px;font-weight:700}
  .ob-proof .stars{color:var(--gold)}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-inner">
    <div class="sp-logo">🧠</div>
    <div class="sp-name">SYN<span>APSE</span></div>
    <div class="sp-tag">Reprogramme ton cerveau, une idée à la fois</div>
    <div class="sp-proof"><span class="stars">★★★★★</span> 4,9 · 2,4 M d'apprenants</div>
  </div>
</div>
<div id="app">

  <!-- ============ FEED (TikTok) ============ -->
  <section class="view active" id="v-feed">
    <canvas id="fx"></canvas>
    <div class="topbar">
      <div class="brand">SYN<span>APSE</span></div>
      <div class="top-stats">
        <button id="sound-btn" class="pill sound" onclick="toggleSound()"><span class="si">🔈</span> Focus</button>
        <div class="pill streak">🔥 <span id="t-streak">0</span></div>
        <div class="pill xp">⚡ <span id="t-xp">0</span></div>
      </div>
    </div>
    <div id="feed"></div>
  </section>

  <!-- ============ EXPLORER ============ -->
  <section class="view" id="v-explore">
    <div class="scroll"><div class="page">
      <h1>Explorer</h1>
      <p class="sub">Choisis un terrain. Chaque carte est une brique pour ton nouveau cerveau.</p>
      <div class="grid2" id="theme-grid"></div>
    </div></div>
  </section>

  <!-- ============ REVISER ============ -->
  <section class="view" id="v-review">
    <div class="rev-wrap" id="rev-wrap"></div>
  </section>

  <!-- ============ BIBLIOTHEQUE ============ -->
  <section class="view" id="v-lib">
    <div class="scroll"><div class="page">
      <h1>Ma bibliothèque</h1>
      <p class="sub">Tout ce que tu as gravé. Révisé au bon moment pour ne jamais l'oublier.</p>
      <div id="lib-list"></div>
    </div></div>
  </section>

  <!-- ============ MOI / IDENTITE ============ -->
  <section class="view" id="v-me">
    <div class="scroll"><div class="page" id="me-page"></div></div>
  </section>

  <!-- ============ NAV ============ -->
  <nav class="nav">
    <button data-go="feed" class="active"><span class="nic">🏠</span>Pour toi</button>
    <button data-go="explore"><span class="nic">🧭</span>Explorer</button>
    <button data-go="review"><span class="nic">🔁</span>Réviser<span class="badge" id="rev-badge" style="display:none">0</span></button>
    <button data-go="lib"><span class="nic">📚</span>Biblio</button>
    <button data-go="me"><span class="nic">👤</span>Moi</button>
  </nav>

  <!-- ============ MODALS ============ -->
  <div class="modal" id="modal-comments"><div class="sheet" id="comments-sheet"></div></div>
  <div class="modal" id="modal-onboard"><div class="sheet" id="onboard-sheet"></div></div>
  <div class="modal" id="modal-create"><div class="sheet" id="create-sheet"></div></div>
  <div class="modal" id="modal-identity"><div class="sheet" id="identity-sheet"></div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="content.js"></script>
<script src="photos.js"></script>
<script>
/* ============================================================
   SYNAPSE — logique application
   ============================================================ */
const KEY = 'synapse_state_v1';
const today = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
const REV_INTERVALS = [0,1,3,7,16,35,70]; // jours par boîte (répétition espacée)
const DAILY_GOAL = 7;

const DEFAULT = {
  onboarded:false, prenom:'', identite:'', interets:[],
  xp:0, streak:0, lastActive:'', dailyCount:0, dailyDate:'',
  seen:[], liked:[], stash:{}, own:[], myComments:{}
};
let S = load();

function load(){ try{ return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ return {...DEFAULT}; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* -------- niveau -------- */
function currentLevel(){
  let lv = NIVEAUX[0], next = null;
  for(let i=0;i<NIVEAUX.length;i++){
    if(S.xp>=NIVEAUX[i].seuil){ lv=NIVEAUX[i]; next=NIVEAUX[i+1]||null; }
  }
  return {lv,next};
}

/* -------- gamification -------- */
function addXP(n){ S.xp+=n; refreshStats(); save(); }
function touchDay(){
  const d=today();
  if(S.dailyDate!==d){ S.dailyDate=d; S.dailyCount=0; }
  // streak
  if(S.lastActive!==d){
    const y=new Date(); y.setDate(y.getDate()-1);
    const yStr=y.toLocaleDateString('en-CA');
    S.streak = (S.lastActive===yStr) ? S.streak+1 : 1;
    S.lastActive=d;
  }
}
function refreshStats(){
  document.getElementById('t-streak').textContent=S.streak;
  document.getElementById('t-xp').textContent=S.xp;
  const b=document.getElementById('rev-badge'); const due=dueCards().length;
  if(due>0){ b.style.display='flex'; b.textContent=due; } else b.style.display='none';
}

/* -------- feed personnalisé -------- */
function allCards(){
  const own = S.own.map(o=>({id:o.id,theme:o.theme||'mental',titre:o.titre,corps:o.corps,source:'Ta propre idée',auteur:S.prenom||'Toi',mine:true}));
  return CARTES.concat(own);
}
function personalized(){
  const cards = allCards().slice();
  const w = c => {
    let s=0;
    if(S.interets.includes(c.theme)) s-=10;   // intérêts d'abord
    if(!S.seen.includes(c.id)) s-=5;           // non vus d'abord
    if(c.mine) s-=3;
    s += (c.id.charCodeAt(0)+c.id.length);     // ordre stable, pseudo-mélange
    return s;
  };
  return cards.sort((a,b)=>w(a)-w(b));
}

/* -------- répétition espacée -------- */
function scheduleReview(id, box){
  const d=new Date(); d.setDate(d.getDate()+REV_INTERVALS[Math.min(box,REV_INTERVALS.length-1)]);
  S.stash[id]={ box, due:d.toLocaleDateString('en-CA'), addedAt: S.stash[id]?.addedAt||today() };
}
function dueCards(){
  const t=today();
  return Object.keys(S.stash).filter(id=>S.stash[id].due<=t);
}
function cardById(id){ return allCards().find(c=>c.id===id); }

/* ============================================================
   RENDU
   ============================================================ */
function themeOf(c){ return THEMES[c.theme]||THEMES.mental; }

function illKey(c){
  return (typeof VISUELS!=='undefined' && VISUELS[c.id]) ||
         (typeof THEME_ICON!=='undefined' && THEME_ICON[c.theme]) || 'brain';
}
function iconSVG(key,color){
  const inner=(typeof ICONS!=='undefined' && ICONS[key]) ? ICONS[key] : '';
  return '<svg viewBox="0 0 100 100" fill="none" stroke="'+color+'" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}
// grande "image" pédagogique de la carte : infographie sur mesure si dispo, sinon icône agrandie
function posterScene(c,color){
  const key=illKey(c); const inner=(typeof ICONS!=='undefined' && ICONS[key])?ICONS[key]:'';
  return '<g transform="translate(110,40)" stroke="'+color+'" style="color:'+color+'" stroke-width="3.4" fill="none">'+inner+'</g>';
}
function heroHTML(c, th){
  // 1) vraie photo si disponible pour cette carte
  const pk=(typeof PHOTO_OF!=='undefined' && PHOTO_OF[c.id]);
  if(pk && typeof PHOTOS!=='undefined' && PHOTOS[pk]){
    const ph=PHOTOS[pk];
    const cred=esc(ph.credit)+(ph.license?(' · '+esc(ph.license)):'');
    return '<div class="hero photo ph-'+pk+'">'
      +'<span class="hero-accent" style="background:'+th.couleur+'"></span>'
      +'<span class="credit">📷 '+cred+'</span></div>';
  }
  // 2) sinon infographie sur mesure, 3) sinon icône agrandie
  const key=(typeof SCENE_OF!=='undefined' && SCENE_OF[c.id]);
  const inner=(key && typeof SCENES!=='undefined' && SCENES[key]) ? SCENES[key](th.couleur) : posterScene(c, th.couleur);
  const bg='linear-gradient(150deg, '+th.couleur+'24, #0d0d0d 72%)';
  return '<div class="hero" style="background:'+bg+'"><svg class="scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet" fill="none" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg></div>';
}
// injecte une classe CSS par photo (image chargée une seule fois)
function initPhotos(){
  if(typeof PHOTOS==='undefined') return;
  let css='';
  for(const k in PHOTOS){ css+='.ph-'+k+"{background-image:url('"+PHOTOS[k].data+"')}"; }
  const s=document.createElement('style'); s.textContent=css; document.head.appendChild(s);
}

/* ---- engagement social (déterministe par carte : donne une impression d'appli vivante) ---- */
const AVC=['#D4AF37','#EF6B6B','#38BDF8','#4ADE80','#A78BFA','#60A5FA'];
function hashId(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
function fmtCount(n){ n=Math.round(n);
  if(n>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' M';
  if(n>=1e4) return Math.round(n/1e3)+' k';
  if(n>=1e3) return (n/1e3).toFixed(1).replace('.',',')+' k';
  return ''+n; }
function engagement(id){
  const h=hashId(id);
  const likes=1500+(h%640000);
  const stashes=Math.floor(likes*(0.10+(h%60)/1000));
  const comments=9+(h%260);
  const shares=Math.floor(likes*(0.02+(h%30)/1000));
  return {likes,stashes,comments,shares};
}
function genComments(id){
  const h=hashId(id); const k=3+(h%5); const out=[];
  for(let i=0;i<k;i++){ const hi=hashId(id+'_'+i);
    out.push({ nom:NOMS[hi%NOMS.length], txt:COMMENTAIRES[(hi>>>3)%COMMENTAIRES.length],
      likes:1+((hi>>>5)%340), av:hi%AVC.length, j:1+((hi>>>7)%72) }); }
  return out;
}

function slideHTML(c){
  const th=themeOf(c);
  const stashed = !!S.stash[c.id];
  const liked = S.liked.includes(c.id);
  const eng = engagement(c.id);
  const grad = `radial-gradient(135% 82% at 22% 4%, ${th.couleur}33, transparent 56%)`;
  return `
  <div class="slide" data-id="${c.id}">
    <div class="slide-bg" style="background:${grad}"></div>
    <div class="slide-inner">
      ${heroHTML(c, th)}
      <span class="theme-chip" style="color:${th.couleur}">${th.emoji} ${th.nom}</span>
      <h2>${esc(c.titre)}</h2>
      <p>${esc(c.corps)}</p>
      <div class="src">📖 <b>${esc(c.source)}</b> · ${esc(c.auteur)}</div>
    </div>
    <div class="rail">
      <button data-act="like" data-id="${c.id}" class="${liked?'on-red':''}">
        <span class="ic">${liked?'❤️':'🤍'}</span><b>${fmtCount(eng.likes+(liked?1:0))}</b></button>
      <button data-act="stash" data-id="${c.id}" class="${stashed?'on':''}">
        <span class="ic">${stashed?'✅':'📌'}</span><b>${fmtCount(eng.stashes+(stashed?1:0))}</b></button>
      <button data-act="comment" data-id="${c.id}"><span class="ic">💬</span><b>${fmtCount(eng.comments+((S.myComments&&S.myComments[c.id]||[]).length))}</b></button>
      <button data-act="share" data-id="${c.id}"><span class="ic">↗</span><b>${fmtCount(eng.shares)}</b></button>
    </div>
  </div>`;
}

let feedBuilt=false, io=null;
function buildFeed(){
  const feed=document.getElementById('feed');
  const cards=personalized();
  feed.innerHTML = cards.map(slideHTML).join('') +
    `<div class="slide end"><div class="slide-inner" style="text-align:center">
       <div style="font-size:44px;margin-bottom:14px">👑</div>
       <h2>Tu as parcouru tout le fil du moment.</h2>
       <p>Reviens demain : de nouvelles idées, ta série qui grandit, ton cerveau qui se recâble. Un peu, mais tous les jours.</p>
       <button class="btn btn-gold" onclick="go('review')" style="max-width:280px;margin:10px auto 0">Réviser ce que j'ai gravé</button>
     </div></div>`;
  feedBuilt=true;
  // observer : marquer vu quand la carte est à l'écran
  if(io) io.disconnect();
  io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting && en.intersectionRatio>0.6){
      const id=en.target.dataset.id; if(id) markSeen(id);
    }});
  },{threshold:[0.6]});
  feed.querySelectorAll('.slide[data-id]').forEach(s=>io.observe(s));
  // actions
  feed.querySelectorAll('.rail button').forEach(btn=>{
    btn.addEventListener('click', ()=>railAction(btn.dataset.act, btn.dataset.id, btn));
  });
}
function markSeen(id){
  touchDay();
  const _c=cardById(id); if(_c) setFeedTheme(themeOf(_c).couleur);
  if(!S.seen.includes(id)){ S.seen.push(id); S.dailyCount++; addXP(5);
    if(S.dailyCount===DAILY_GOAL) toast('🎯 Objectif du jour atteint ! +'+DAILY_GOAL+' idées');
  }
  save(); refreshStats();
}
function railAction(act,id,btn){
  const c=cardById(id); if(!c) return;
  const eng=engagement(id);
  if(act==='like'){
    const i=S.liked.indexOf(id);
    if(i>=0){ S.liked.splice(i,1); btn.classList.remove('on-red'); btn.querySelector('.ic').textContent='🤍'; }
    else { S.liked.push(id); btn.classList.add('on-red'); btn.querySelector('.ic').textContent='❤️'; addXP(2); }
    btn.querySelector('b').textContent=fmtCount(eng.likes+(S.liked.includes(id)?1:0));
    save();
  } else if(act==='stash'){
    if(S.stash[id]){ delete S.stash[id]; btn.classList.remove('on'); btn.querySelector('.ic').textContent='📌'; }
    else { scheduleReview(id,0); btn.classList.add('on'); btn.querySelector('.ic').textContent='✅'; addXP(3); toast('📌 Gravé — tu le reverras au bon moment'); }
    btn.querySelector('b').textContent=fmtCount(eng.stashes+(S.stash[id]?1:0));
    save(); refreshStats();
  } else if(act==='comment'){
    openComments(id);
  } else if(act==='share'){
    const txt=`${c.titre}\n\n${c.corps}\n\n— ${c.source}, ${c.auteur}\n(via Synapse)`;
    if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); }
    else { navigator.clipboard?.writeText(txt); toast('📋 Copié'); }
  }
}
/* ---- commentaires ---- */
function openComments(id){
  const c=cardById(id); const gen=genComments(id);
  const mine=(S.myComments&&S.myComments[id])||[];
  const all=mine.concat(gen);
  const total=engagement(id).comments+mine.length;
  let h=`<h2>${fmtCount(total)} commentaires</h2><p class="sub">${esc(c.titre)}</p><div class="cmts">`;
  all.forEach(cm=>{ const av=AVC[cm.av||0];
    h+=`<div class="cmt"><div class="av" style="background:${av}">${esc((cm.nom||'?').charAt(0).toUpperCase())}</div>
      <div class="cbody"><div class="cn">${esc(cm.nom)} <span>· ${cm.j?('il y a '+cm.j+' j'):'à l’instant'}</span></div>
      <div class="ct">${esc(cm.txt)}</div><div class="cmeta">❤️ ${cm.likes||0} · Répondre</div></div></div>`; });
  h+=`</div><div class="cbar"><input id="cin" class="tf" placeholder="Ajoute un commentaire…" maxlength="140">
    <button class="cpub" onclick="postComment('${id}')">Publier</button></div>`;
  document.getElementById('comments-sheet').innerHTML=h;
  document.getElementById('modal-comments').classList.add('open');
}
function postComment(id){
  const el=document.getElementById('cin'); const v=(el.value||'').trim(); if(!v) return;
  S.myComments=S.myComments||{}; (S.myComments[id]=S.myComments[id]||[]).unshift({nom:(S.prenom||'Toi'),txt:v,likes:0,j:0,av:0});
  save(); addXP(1); openComments(id); toast('Commentaire publié 💬');
  if(feedBuilt){ const b=document.querySelector('#feed .slide[data-id="'+id+'"] button[data-act="comment"] b'); if(b) b.textContent=fmtCount(engagement(id).comments+(S.myComments[id].length)); }
}

function openTheme(tid){
  S._filter=tid;
  // réordonne le feed pour ce thème et bascule dessus
  const feed=document.getElementById('feed');
  const th=THEMES[tid];
  const cards=allCards().filter(c=>c.theme===tid);
  feed.innerHTML=cards.map(slideHTML).join('')+
    `<div class="slide end"><div class="slide-inner" style="text-align:center">
       <div style="font-size:40px">${th.emoji}</div><h2>Fin du thème « ${th.nom} ».</h2>
       <p>Passe à un autre terrain ou révise ce que tu as gravé.</p>
       <button class="btn btn-gold" onclick="rebuildAndFeed()" style="max-width:260px;margin:8px auto 0">Retour au fil « Pour toi »</button></div></div>`;

/* -------- révision -------- */
let revQueue=[], revCurrent=null, revShown=false;
function buildReview(){
  const w=document.getElementById('rev-wrap');
  revQueue=dueCards();
  if(revQueue.length===0){
    const total=Object.keys(S.stash).length;
    w.innerHTML=`<div class="empty">
      <div class="e">🧘</div>
      <h2 style="color:var(--text)">Rien à réviser maintenant.</h2>
      <p>${total? 'Tu es à jour. Reviens plus tard : les cartes remonteront pile avant que tu les oublies.' : 'Grave des idées dans le fil (bouton 📌) pour construire ta révision espacée.'}</p>
      <button class="btn btn-gold" onclick="go('feed')" style="max-width:260px;margin:16px auto 0">Aller au fil</button>
    </div>`;
    return;
  }
  nextReview();
}
function nextReview(){
  const w=document.getElementById('rev-wrap');
  if(revQueue.length===0){ toast('✅ Révision terminée !'); addXP(10); buildReview(); refreshStats(); return; }
  revCurrent=revQueue[0]; revShown=false;
  const c=cardById(revCurrent); const th=themeOf(c);
  w.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="sec-title" style="margin:0">Révision · ${revQueue.length} restante(s)</div>
      <span class="theme-chip" style="color:${th.couleur};margin:0">${th.emoji} ${th.nom}</span>
    </div>
    <div class="rev-card">
      ${heroHTML(c, th)}
      <h2 style="text-align:center">${esc(c.titre)}</h2>
      <div id="rev-body"></div>
    </div>
    <div id="rev-foot"></div>`;
  const foot=document.getElementById('rev-foot');
  foot.innerHTML=`<button class="btn btn-gold reveal-btn" onclick="revealReview()">Afficher la réponse</button>`;
}
function revealReview(){
  const c=cardById(revCurrent);
  document.getElementById('rev-body').innerHTML=`<div class="rev-answer">${esc(c.corps)}</div>
    <div class="src" style="margin-top:14px;font-size:13px;color:var(--muted)">📖 <b style="color:var(--gold-pale)">${esc(c.source)}</b> · ${esc(c.auteur)}</div>`;
  document.getElementById('rev-foot').innerHTML=`
    <div class="rev-actions">
      <button class="rev-hard" onclick="gradeReview(0)">Difficile</button>
      <button class="rev-mid" onclick="gradeReview(1)">Correct</button>
      <button class="rev-easy" onclick="gradeReview(2)">Facile</button>
    </div>`;
}
function gradeReview(grade){
  const id=revCurrent; const cur=S.stash[id]?.box||0;
  let box = grade===0 ? 0 : grade===1 ? Math.min(cur+1,REV_INTERVALS.length-1) : Math.min(cur+2,REV_INTERVALS.length-1);
  scheduleReview(id,box); addXP(4); save();
  revQueue.shift(); refreshStats(); nextReview();
}

/* -------- bibliothèque -------- */
function buildLib(){
  const box=document.getElementById('lib-list');
  const ids=Object.keys(S.stash);
  if(ids.length===0 && S.own.length===0){
    box.innerHTML=`<div class="empty"><div class="e">📭</div>
      <h2 style="color:var(--text)">Ta bibliothèque est vide.</h2>
      <p>Dans le fil, touche 📌 sur une idée qui te frappe. Elle atterrit ici et revient en révision au bon moment.</p></div>`;
    return;
  }
  // regroupe par thème
  const byTheme={};
  ids.forEach(id=>{ const c=cardById(id); if(!c) return; (byTheme[c.theme]=byTheme[c.theme]||[]).push(c); });
  let html=`<button class="btn btn-ghost" onclick="openCreate()" style="margin-bottom:18px">✍️ Écrire ma propre idée</button>`;
  Object.keys(byTheme).forEach(t=>{
    const th=THEMES[t];
    html+=`<div class="sec-title">${th.emoji} ${th.nom}</div>`;
    byTheme[t].forEach(c=>{
      const st=S.stash[c.id];
      html+=`<div class="card">
        <span class="cardchip" style="background:${th.couleur}22;color:${th.couleur}">Boîte ${st.box+1} · revoir le ${st.due===today()?"aujourd'hui":frDate(st.due)}</span>
        <h3>${esc(c.titre)}</h3><p>${esc(c.corps)}</p>
        <div class="meta">📖 ${esc(c.source)} · ${esc(c.auteur)}
          <button onclick="unstash('${c.id}')" style="float:right;color:var(--warn);font-weight:700">Retirer</button></div>
      </div>`;
    });
  });
  if(S.own.length){
    html+=`<div class="sec-title">✍️ Mes idées</div>`;
    S.own.forEach(o=>{ html+=`<div class="card"><h3>${esc(o.titre)}</h3><p>${esc(o.corps)}</p>
      <div class="meta">Écrite le ${frDate(o.createdAt)}<button onclick="delOwn('${o.id}')" style="float:right;color:var(--warn);font-weight:700">Supprimer</button></div></div>`; });
  }
  box.innerHTML=html;
}
function unstash(id){ delete S.stash[id]; save(); buildLib(); refreshStats(); toast('Retiré de la bibliothèque'); }
function delOwn(id){ S.own=S.own.filter(o=>o.id!==id); delete S.stash[id]; save(); buildLib(); toast('Idée supprimée'); }

function toggleInteret(id){
  const i=S.interets.indexOf(id);

  save(); buildMe(); buildFeed();
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   FOND NEURONAL ANIMÉ (mémoire visuelle)
   Un réseau de neurones vivant qui prend la couleur du thème.
   ============================================================ */
let fxTarget=[212,175,55];           // couleur cible (or au départ)
let fxCur=[212,175,55];
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function setFeedTheme(hex){ try{ fxTarget=hexToRgb(hex); }catch(e){} }
function initFx(){
  const cv=document.getElementById('fx'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const DPR=Math.min(window.devicePixelRatio||1,2);
  const reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0;
  function resize(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.max(1,W*DPR); cv.height=Math.max(1,H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); window.addEventListener('resize',resize);
  const N=reduce?24:40;
  const rnd=()=>Math.random();
  const nodes=Array.from({length:N},()=>({x:rnd(),y:rnd(),vx:(rnd()-.5)*0.0007,vy:(rnd()-.5)*0.0007,r:rnd()*1.7+0.9,p:rnd()*6.28}));
  const LINK=118;
  function frame(){
    fxCur=fxCur.map((v,i)=>v+(fxTarget[i]-v)*0.04);
    const r=Math.round(fxCur[0]), g=Math.round(fxCur[1]), b=Math.round(fxCur[2]);
    ctx.clearRect(0,0,W,H);
    if(!reduce){ for(const n of nodes){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>1)n.vx*=-1; if(n.y<0||n.y>1)n.vy*=-1; n.p+=0.02; } }
    for(let i=0;i<N;i++){ for(let j=i+1;j<N;j++){
      const a=nodes[i],c=nodes[j]; const dx=(a.x-c.x)*W, dy=(a.y-c.y)*H; const d=Math.sqrt(dx*dx+dy*dy);
      if(d<LINK){ ctx.strokeStyle='rgba('+r+','+g+','+b+','+((1-d/LINK)*0.20)+')'; ctx.lineWidth=0.7;
        ctx.beginPath(); ctx.moveTo(a.x*W,a.y*H); ctx.lineTo(c.x*W,c.y*H); ctx.stroke(); }
    }}
    for(const n of nodes){ const pulse=reduce?0.55:(0.42+0.28*Math.sin(n.p));
      ctx.fillStyle='rgba('+r+','+g+','+b+','+pulse+')';
      ctx.beginPath(); ctx.arc(n.x*W,n.y*H,n.r,0,6.29); ctx.fill(); }
    if(!reduce) requestAnimationFrame(frame);
  }
  if(reduce){ frame(); } else { requestAnimationFrame(frame); }
}

/* ============================================================
   SON DE CONCENTRATION (généré, libre de droits)
   Nappe douce + souffle filtré + lent mouvement — style ondes calmes.
   ============================================================ */
let audio=null, audioOn=false, melodyTimer=null;
// Gamme pentatonique de La mineur, registre médium/aigu (audible sur haut-parleurs)
const MEL_NOTES=[440.00,523.25,587.33,659.25,783.99,880.00,1046.50,392.00,329.63];
function toggleSound(){
  if(!audio){ startAudio(); }
  else {
    audioOn=!audioOn;
    audio.master.gain.setTargetAtTime(audioOn?audio.vol:0.0001, audio.ctx.currentTime, 0.5);
    if(audioOn){ if(audio.ctx.state==='suspended') audio.ctx.resume(); scheduleMelody(); }
    else if(melodyTimer){ clearTimeout(melodyTimer); melodyTimer=null; }
  }
  updateSoundBtn();
}
function startAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    const ctx=new AC();
    const master=ctx.createGain(); master.gain.value=0.0001;
    const comp=ctx.createDynamicsCompressor();      // garde le son doux, jamais agressif
    master.connect(comp); comp.connect(ctx.destination);
    const vol=0.20;

    // --- nappe / accord doux (La mineur 9), registre médium bien audible ---
    const padFilter=ctx.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=1500; padFilter.Q.value=0.5;
    const padGain=ctx.createGain(); padGain.gain.value=0.55; padFilter.connect(padGain); padGain.connect(master);
    [220.00,261.63,329.63,493.88].forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type=i%2?'sine':'triangle'; o.frequency.value=f; o.detune.value=(i-1.5)*4;
      const g=ctx.createGain(); g.gain.value=0.085; o.connect(g); g.connect(padFilter); o.start();
    });
    // mouvement lent du filtre (respiration)
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.06; const lg=ctx.createGain(); lg.gain.value=550;
    lfo.connect(lg); lg.connect(padFilter.frequency); lfo.start();

    // --- souffle chaud (bruit brun) ---
    const size=2*ctx.sampleRate; const buf=ctx.createBuffer(1,size,ctx.sampleRate); const d=buf.getChannelData(0); let last=0;
    for(let i=0;i<size;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    const noise=ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=900;
    const ng=ctx.createGain(); ng.gain.value=0.16; noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start();

    // --- écho pour la mélodie (profondeur ambient) ---
    const delay=ctx.createDelay(); delay.delayTime.value=0.4;
    const fb=ctx.createGain(); fb.gain.value=0.34; delay.connect(fb); fb.connect(delay);
    const melBus=ctx.createGain(); melBus.gain.value=0.9; melBus.connect(master); melBus.connect(delay); delay.connect(master);

    audio={ctx,master,vol,melBus};
    audioOn=true;
    if(ctx.state==='suspended') ctx.resume();
    master.gain.setTargetAtTime(vol, ctx.currentTime, 0.9);
    scheduleMelody();
    toast('🎧 Musique de concentration activée');
  }catch(e){ toast('Le son n’est pas dispo sur ce navigateur'); }
}
function playNote(freq){
  if(!audio) return;
  const ctx=audio.ctx, t=ctx.currentTime;
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=freq;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.11,t+0.08);
  g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
  o.connect(g); g.connect(audio.melBus); o.start(t); o.stop(t+2.6);
}
function scheduleMelody(){
  if(!audio||!audioOn) return;
  if(Math.random()<0.72){ playNote(MEL_NOTES[Math.floor(Math.random()*MEL_NOTES.length)]); } // sinon un silence (respiration)
  melodyTimer=setTimeout(scheduleMelody, 1500+Math.random()*2500);
}
function updateSoundBtn(){
  const b=document.getElementById('sound-btn'); if(!b) return;
  b.classList.toggle('on', audioOn);
  b.querySelector('.si').textContent = audioOn ? '🔊' : '🔈';
}

init();

/* -------- PWA -------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
