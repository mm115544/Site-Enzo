<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Marien</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a0f 60%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.35), inset 0 1px 1px rgba(255,255,255,0.2);
      letter-spacing: -1px;
    }
    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.6px;
    }
    .handle {
      color: #9090a8;
      font-size: 15px;
      margin-bottom: 22px;
    }
    .bio {
      color: #c8c8d8;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 32px;
      padding: 0 8px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #50505e;
      letter-spacing: 0.3px;
    }
    svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">M</div>
    <h1>Marien</h1>
    <div class="handle">@ton_pseudo_insta</div>
    <p class="bio">Bienvenue. Tu m'as trouvé.</p>
    <div class="links">
      <a class="link" href="https://instagram.com/ton_pseudo_insta" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
        Instagram
      </a>
    </div>
    <div class="footer">© Marien</div>
  </main>
  <script>
    fetch("/api/track", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        screen: `${window.screen.width}x${window.screen.height}`,
        lang: navigator.language || "",
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      })
    }).catch(() => {});
  </script>
</body>
</html>
